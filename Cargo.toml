[package]
name = "hangar"
version = "0.6.1"
edition = "2024"

[dependencies]
eframe = "0.36.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
trash = "5.2.9"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"
